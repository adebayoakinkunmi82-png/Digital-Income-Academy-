    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      color: #161616;
      line-height: 1.6;
    }

    /* NAVIGATION */
    nav {
      background: #08111f;
      color: white;
      padding: 18px 6%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .logo {
      font-size: 21px;
      font-weight: 800;
    }

    .logo span {
      color: #00e676;
    }

    .links a {
      color: white;
      text-decoration: none;
      margin-left: 20px;
      font-size: 14px;
    }

    /* HERO */
    .hero {
      background:
        radial-gradient(circle at top right, #123d34 0%, transparent 35%),
        linear-gradient(135deg, #08111f, #101d35);
      color: white;
      text-align: center;
      padding: 80px 7% 90px;
    }

    .badge {
      display: inline-block;
      color: #00e676;
      border: 1px solid #00e676;
      background: rgba(0, 230, 118, 0.08);
      padding: 8px 16px;
      border-radius: 30px;
      font-size: 13px;
      margin-bottom: 20px;
    }

    .hero h1 {
      font-size: clamp(38px, 8vw, 68px);
      line-height: 1.05;
      margin-bottom: 22px;
    }

    .hero h1 span {
      color: #00e676;
    }

    .hero p {
      max-width: 680px;
      margin: auto;
      color: #d7dce5;
      font-size: 18px;
    }

    .hero-buttons {
      margin-top: 32px;
    }

    .btn {
      display: inline-block;
      padding: 15px 25px;
      border-radius: 9px;
      text-decoration: none;
      font-weight: bold;
      margin: 5px;
      transition: 0.2s;
    }

    .btn:hover {
      transform: translateY(-3px);
    }

    .btn-primary {
      background: #00e676;
      color: #06120b;
    }

    .btn-secondary {
      color: white;
      border: 1px solid #ffffff55;
    }

    /* SECTIONS */
    section {
      padding: 70px 7%;
    }

    .section-title {
      text-align: center;
      margin-bottom: 40px;
    }

    .section-title h2 {
      font-size: 32px;
      margin-bottom: 8px;
    }

    .section-title p {
      color: #666;
    }

    /* COURSES */
    .courses {
      max-width: 1100px;
      margin: auto;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    /* BLACK COURSE CARDS */
    .card {
      background: #101E33;
      color: white;
      padding: 28px;
      border-radius: 15px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.18);
      transition: 0.2s;
    }

    .card:hover {
      transform: translateY(-5px);
    }

    .card-icon {
      font-size: 34px;
      margin-bottom: 15px;
    }

    .card h3 {
      color: #00a957;
      margin-bottom: 8px;
    }

    .card p {
      color: #E8EAF0;
      font-size: 15px;
    }

    /* ABOUT */
    .about {
      background: #08111f;
      color: white;
    }

    .about-content {
      max-width: 850px;
      margin: auto;
      text-align: center;
    }

    .about-content p {
      color: #d7dce5;
    }

    /* BENEFITS */
    .benefits {
      max-width: 900px;
      margin: auto;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
    }

    .benefit {
      background: white;
      padding: 23px;
      border-radius: 12px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.05);
    }

    .benefit strong {
      display: block;
      margin-bottom: 5px;
    }

    /* WHO */
    .who {
      max-width: 800px;
      margin: auto;
    }

    .who ul {
      list-style: none;
    }

    .who li {
      background: white;
      margin: 10px 0;
      padding: 16px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.04);
    }

    .who li::before {
      content: "✓";
      color: #00a957;
      font-weight: bold;
      margin-right: 10px;
    }

    /* NOTICE */
    .notice {
      max-width: 850px;
      margin: auto;
      background: #fff8e6;
      border-left: 5px solid #f0a500;
      padding: 22px;
      border-radius: 8px;
    }

    .notice h3 {
      margin-bottom: 8px;
    }

    /* CTA */
    .cta {
      background: linear-gradient(135deg, #00e676, #00b85c);
      text-align: center;
      color: #06120b;
    }

    .cta h2 {
      font-size: 36px;
      margin-bottom: 10px;
    }

    .cta p {
      margin-bottom: 22px;
    }

    .cta .btn {
      background: #08111f;
      color: white;
    }

    /* FAQ */
    .faq {
      max-width: 800px;
      margin: auto;
    }

    details {
      background: white;
      margin-bottom: 12px;
      padding: 18px;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.04);
    }

    summary {
      font-weight: bold;
    }

    details p {
      margin-top: 10px;
      color: #666;
    }

    /* PRIVACY */
    .privacy {
      background: #eef1f5;
    }

    .privacy-inner {
      max-width: 800px;
      margin: auto;
      background: white;
      padding: 38px 34px;
      border-radius: 14px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.05);
    }

    .privacy-inner h2 {
      font-size: 30px;
      text-align: center;
      margin-bottom: 20px;
    }

    .privacy-inner p {
      color: #555;
      font-size: 15px;
      margin-bottom: 14px;
    }

    .privacy-inner h4 {
      margin: 22px 0 8px;
      font-size: 17px;
    }

    /* FOOTER */
    footer {
      background: #050912;
      color: #999;
      text-align: center;
      padding: 30px 15px;
      font-size: 14px;
    }

    footer strong {
      color: white;
    }

    .footer-links {
      margin: 12px 0;
    }

    .footer-links a {
      color: #00e676;
      text-decoration: none;
      margin: 0 10px;
      font-size: 14px;
    }

    .footer-links a:hover {
      text-decoration: underline;
    }

    .footer-contact {
      color: #bbb;
      font-size: 14px;
      margin-top: 6px;
    }

    .footer-contact a {
      color: #00e676;
      text-decoration: none;
    }

    /* MOBILE */
    @media (max-width: 768px) {

      nav {
        padding: 16px 5%;
      }

      .links {
        display: none;
      }

      .hero {
        padding: 60px 6% 70px;
      }

      .hero p {
        font-size: 16px;
      }

      section {
        padding: 55px 6%;
      }

      .courses {
        grid-template-columns: 1fr;
      }

      .benefits {
        grid-template-columns: 1fr;
      }

      .section-title h2 {
        font-size: 28px;
      }

      .cta h2 {
        font-size: 29px;
      }

      .btn {
        display: block;
        max-width: 310px;
        margin: 10px auto;
      }
    }
